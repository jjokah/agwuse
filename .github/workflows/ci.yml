name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agwuse_test
          POSTGRES_PASSWORD: agwuse_test
          POSTGRES_DB: agwuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agwuse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agwuse_test:agwuse_test@localhost:5432/agwuse_test
      DIRECT_DATABASE_URL: postgresql://agwuse_test:agwuse_test@localhost:5432/agwuse_test
      TEST_DATABASE_URL: postgresql://agwuse_test:agwuse_test@localhost:5432/agwuse_test
      ALLOW_TEST_DATABASE_RESET: "true"
      AUTH_SECRET: ci-test-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser workflows
        run: npm run test:browser

      - name: Dependency applicability gate
        if: always()
        run: npm run audit:dependencies

      - name: Verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-verification
          path: |
            test-results/
            playwright-report/
          retention-days: 14
